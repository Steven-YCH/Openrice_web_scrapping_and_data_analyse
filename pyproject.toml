[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrice-scraper"
version = "0.1.0"
description = "Portfolio scraper for Hong Kong restaurants via OpenRice public JSON APIs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Steven-YCH" }]
keywords = ["openrice", "scraper", "hong-kong", "restaurants", "portfolio"]
dependencies = [
    "requests>=2.31,<3",
    "urllib3>=2.0,<3",
]

[project.optional-dependencies]
analysis = [
    "pandas>=2.0,<3",
    "pyarrow>=14,<20",
]
dev = [
    "pytest>=7.4,<9",
]

[project.scripts]
openrice-scraper = "openrice_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
